# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Pushes to main, and every pull request whatever its base.
  push:
    branches: [ main ]
  # A stacked layer joins its stack after it opens, and joining fires no
  # workflow trigger, so the run from its own `opened` event is the only one it
  # is guaranteed. Leave `pull_request` unfiltered by base so that run happens.
  pull_request:

  # The escape hatch for a stacked pull request whose checks never fired.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and Test
        run: |
          npm ci
          npm run build
          npm test
